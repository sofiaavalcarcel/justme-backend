services:
  api:
    build:
      context: .
      target: production
    container_name: justme_api_prod
    env_file:
      - .prod.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    restart: always
    networks:
      - prod_net

  postgres:
    image: postgis/postgis:17-3.5
    container_name: justme_postgres_prod
    environment:
      POSTGRES_DB: justme_prod_db
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prod_user -d justme_prod_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prod_net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: root@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5052:80"
    networks:
      - prod_net

volumes:
  postgres_prod_data:

networks:
  prod_net:
