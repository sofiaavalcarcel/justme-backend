services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: justme_postgres_dev
    environment:
      POSTGRES_DB: justme_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d justme_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: root@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    networks:
      - dev_net

  redis:
    image: redis:7-alpine
    container_name: justme_redis_dev
    ports:
      - "6379:6379"
    networks:
      - dev_net

volumes:
  postgres_dev_data:

networks:
  dev_net:
